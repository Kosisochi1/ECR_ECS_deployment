# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
        
permissions:
  contents: read
  security-events: write
jobs:

  pre-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Scan Repo for leaks
      uses: gitleaks/gitleaks-action@v2
      continue-on-error: true

    - name: Trivy vulnerability scanner in fs mode
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        trivy-config: trivy.yaml
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: go

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.22"
        cache: true
        cache-dependency-path: application-code/go.sum

    - name: Download Dependency
      working-directory: application-code
      run: go mod download

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v6
      env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    
    - name: Vulnerabity Scan
      working-directory: application-code 
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./... || echo "Vulnerability detected"



    - name:    Unit Test
      working-directory: application-code
      run: |
        go test  ./... -v || echo "review manually"

    - name: Integration Test
      working-directory: application-code
      run: |
        INTEGRATION=true go test -v --tags=integration ./...
        
    - name: Upload SARIF to Security tab
      uses: github/codeql-action/upload-sarif@v4
      with:
       sarif_file: results.sarif
    
    - name: Notify Slack
      if: always()
      run: |
         STATUS="${{ job.status }}"
    
         if [ "$STATUS" == "success" ]; then
            MESSAGE="✅ Pre-build Check Completed"
         else
            MESSAGE="❌ Pre-build Check Failed"
         fi

         curl -X POST -H 'Content-type: application/json' \
         --data "{\"text\":\"$MESSAGE\"}" \
         ${{ secrets.SLACK_WEBHOOK_URL }}

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: pre-build

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22


      - name: Configure AWS 
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t demo-app .

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
         image-ref: demo-app:latest
         format: 'sarif'
         output: 'trivy-image-results.sarif'
         severity: 'CRITICAL,HIGH'
        
      - name: Tag Image
        run: |
        
          docker tag demo-app:latest ${{secrets.ECR_REPO}}:1.0.0

      - name: Push Image 
        run:  docker push ${{ secrets.ECR_REPO }}:1.0.0
        
      - name: Notify Slack
        if: always()
        run: |
         STATUS="${{ job.status }}"
    
         if [ "$STATUS" == "success" ]; then
            MESSAGE="✅ Build Process Completed"
         else
            MESSAGE="❌ Build Process Failed"
         fi

         curl -X POST -H 'Content-type: application/json' \
         --data "{\"text\":\"$MESSAGE\"}" \
         ${{ secrets.SLACK_WEBHOOK_URL }}
   
          
    
     
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build


    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4


      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: us-east-1


      - name: Download Task Definition
        run: aws s3 cp s3://much-todo-demo-fa44f2/task_def.json . 
        
      - name: Notify Slack
        if: always()
        run: |
         STATUS="${{ job.status }}"
    
         if [ "$STATUS" == "success" ]; then
            MESSAGE="✅ Task Definition Download Completed"
         else
            MESSAGE="❌ Task Definition Download Failed"
         fi

         curl -X POST -H 'Content-type: application/json' \
         --data "{\"text\":\"$MESSAGE\"}" \
         ${{ secrets.SLACK_WEBHOOK_URL }}


      - name: Render new ECS task definition
        id: task_def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
           task-definition: task_def.json
           container-name: much_todo_demo
           image: ${{ secrets.ECR_REPO }}:latest

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task_def.outputs.task-definition }}   
          service: much_todo_demo-service
          cluster: much_todo_demo-cluster
          wait-for-service-stability: true


      - name: Get ALB DNS
        id: alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?contains(LoadBalancerName, 'much-to-do')].DNSName" \
            --output text)

          echo "ALB_DNS=$ALB_DNS"
          echo "ALB_URL=http://$ALB_DNS" >> $GITHUB_ENV

      - name: Wait for ALB Health
        run: |
          for i in {1..20}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" $ALB_URL)

            if [ "$STATUS" == "200" ] || [ "$STATUS" == "301" ] || [ "$STATUS" == "302" ]; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 30
          done

          echo "Application failed health check"
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: ${{ env.ALB_URL }}
          cmd_options: "--autooff"
          fail_action: true

      - name: Notify Slack
        if: always()
        run: |
         STATUS="${{ job.status }}"
    
         if [ "$STATUS" == "success" ]; then
            MESSAGE="✅ Depolyment Completed"
         else
            MESSAGE="❌ Deployment Failed"
         fi

         curl -X POST -H 'Content-type: application/json' \
         --data "{\"text\":\"$MESSAGE\"}" \
         ${{ secrets.SLACK_WEBHOOK_URL }}

    
    
